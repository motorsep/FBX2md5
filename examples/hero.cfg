# fbx2md5 example config: one character, mesh and animations in separate FBX
# files (the usual shape of a Cascadeur / Akeytsu / Blender export set).
#
#   fbx2md5 -cfg hero.cfg
#
# Paths are relative to this file. One directive per line; '#' or '//'
# starts a comment; double-quote anything containing spaces. See README.md
# for the full directive list and what each one does.

# --- Mesh + skeleton -----------------------------------------------------
# The FBX that carries the skinned mesh. Its skeleton is the reference every
# anim file below must match (same joint names and parents).
mesh      hero_bind.fbx

# Output stem: writes <stem>.md5mesh and puts every anim next to it.
# Absolute paths work too, e.g. straight into the game's base/ tree.
output    ../models/md5/hero/hero

# --- Units ---------------------------------------------------------------
# Compare the "scaling positions by" line and the md5anim bounds against
# the size you expect; what an exporter writes depends on its settings.
nounits                     # the FBX is already in engine units...
#scale    0.3937            # ...or scale it (cm -> inches here)

# --- Mesh format -----------------------------------------------------------
v12                         # MD5 v12: per-vertex normals + MikkTSpace tangents

# --- Materials -------------------------------------------------------------
# <FBX material name> <engine material>. Get the left-hand names with
#   fbx2md5 -listMaterials hero_bind.fbx
# A mesh with no material is matched by its node name instead.
shader    "Body_mat"   models/characters/hero/body
shader    "Head_mat"   models/characters/hero/head
shader    "Hair_mat"   models/characters/hero/hair

# --- Meshes to leave out -------------------------------------------------
# By mesh node name. The skeleton is untouched, so the anims below still fit
# a build with these meshes in and a build with them out.
#skipmesh Hair

# --- Root motion -----------------------------------------------------------
# idTech4 reads locomotion from the root joint only. If the animations carry
# their travel on the pelvis instead, move it onto the root:
#rootmotion pelvis          # horizontal only; "rootmotion pelvis xyz" for all

# --- Animations ------------------------------------------------------------
# <file.fbx> <anim name>  ->  <output dir>/<anim name>.md5anim
# The anim FBXs need no mesh. A stack in which nothing moves (a pose) is
# written as a single frame.
anim      hero_bind.fbx           init
anim      hero_run.fbx            run
anim      hero_run_back.fbx       run_back
anim      hero_strafe_left.fbx    run_strafe_left
anim      hero_strafe_right.fbx   run_strafe_right
